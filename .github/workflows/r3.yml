name: Build R3.1 isolated runtime and splash policy
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download exact input
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build dist
          gh release download input-21.2.0 --repo "$GITHUB_REPOSITORY" --pattern qishui-21.2.0-original.ipa --dir build
      - name: Compile and test callback guards on macOS
        run: |
          set -o pipefail
          xcrun --sdk macosx clang -fobjc-arc -Wall -Wextra -Werror -framework Foundation src/AdFlow.m tests/AdFlowTests.m -o build/AdFlowTests 2>&1 | tee build/flow-tests-compile.log
          build/AdFlowTests | tee dist/flow-tests.txt
          xcrun --sdk macosx clang -fobjc-arc -Wall -Wextra -Werror -framework Foundation src/ProbeCore.m tests/ProbeTests.m -o build/ProbeTests 2>&1 | tee build/probe-tests-compile.log
          build/ProbeTests | tee dist/probe-tests.txt
      - name: Compile iOS 17 ARM64 runtime and splash instructions
        run: |
          set -o pipefail
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=17.0 -fobjc-arc -Wall -Wextra -Werror -D'QS_PROBE_BUILD=@"R3.1"' -include src/IdentityR31.h -dynamiclib -framework Foundation -framework UIKit -Wl,-install_name,@executable_path/Frameworks/QishuiR31.dylib src/AdFlow.m src/NoAdsRuntime.m src/ProbeCore.m src/ProbeUI.m -o build/QishuiR31.dylib 2>&1 | tee build/ios-compile.log
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=17.0 -c src/WaitPatches.S -o build/WaitPatches.o
          xcrun otool -tvV build/WaitPatches.o > dist/assembled-instructions.txt
          codesign --force --sign - --timestamp=none build/QishuiR31.dylib
          codesign --verify --strict build/QishuiR31.dylib
      - name: Apply guarded splash policy and inject runtime
        run: |
          set -o pipefail
          python3 scripts/r3.py prepare --input build/qishui-21.2.0-original.ipa --object build/WaitPatches.o --dylib build/QishuiR31.dylib --work build/r3-work 2>&1 | tee build/prepare.log
      - name: Sign and verify app for TrollStore
        run: |
          set -o pipefail
          codesign --force --sign - --timestamp=none --generate-entitlement-der --entitlements build/r3-work/entitlements.plist build/r3-work/Payload/SchubertAppStore.app 2>&1 | tee build/sign.log
          codesign --verify --strict --verbose=2 build/r3-work/Payload/SchubertAppStore.app 2>&1 | tee dist/signature-verification.txt
      - name: Package and compare executable sections and resources
        run: |
          set -o pipefail
          python3 scripts/ipa.py package --work build/r3-work --output dist/Qishui-21.2.0-TrollStore-R3.1.ipa
          python3 scripts/r3.py verify --input build/qishui-21.2.0-original.ipa --object build/WaitPatches.o --dylib build/QishuiR31.dylib --output dist/Qishui-21.2.0-TrollStore-R3.1.ipa --report dist/verification.json 2>&1 | tee build/verify.log
          shasum -a 256 dist/Qishui-21.2.0-TrollStore-R3.1.ipa > dist/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Qishui-TrollStore-R3.1
          path: dist/
          retention-days: 14
          if-no-files-found: error
      - name: Failure logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: R3-failure-logs
          path: build/*.log
          if-no-files-found: ignore
